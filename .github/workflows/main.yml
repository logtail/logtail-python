name: tests

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Released Python versions only. The E2E workflow covers the newest stable
        # and the next pre-release Python.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Test with tox
      run: tox

  typecheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r test-requirements.txt
    - name: Type-check with mypy
      run: mypy
    - name: Type-check the public API as a strict consumer
      # Errors inside logtail itself stay silent, as they are for an installed package.
      run: mypy --strict --follow-imports=silent tests/typecheck
